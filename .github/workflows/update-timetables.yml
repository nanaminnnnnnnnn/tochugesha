# 毎月1回、Yahoo!路線情報から時刻表を取り直して index.html を更新する。
# 変更があればコミット → Vercel が自動で再デプロイする。
# GitHub の Actions タブから「Run workflow」で手動実行もできる。
name: 時刻表の自動更新

on:
  schedule:
    - cron: "0 18 1 * *"   # 毎月1日 18:00 UTC = 毎月2日 3:00 日本時間
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 時刻表を取得して index.html を書き換え
        run: node scripts/fetch_timetables.js index.html --apply --no-backup

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- index.html; then
            echo "時刻表に変更はありませんでした"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "時刻表を自動更新 ($(date +%Y-%m-%d))"
          git push
